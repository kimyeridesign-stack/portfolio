const P = PAGES[Q.get("p") || "cheremi"];
const app = document.getElementById("app");
const H = [];
const kv = ([k, v, p]) => `<dl class="kv"><dt>${k}</dt><dd${p ? ' class="p"' : ""}>${esc(v)}</dd></dl>`;
H.push(`<section class="intro"><h1 class="ttl rv">${esc(P.title).replace(/\n/g, "<br>")}</h1>
<div class="inf rv">${P.info.map((col, i) => `<div class="c${i + 1}">${col.map(kv).join("")}</div>`).join("")}</div><i class="cue"></i></section>`);

function media(b) {
  const inner = b.html || `<img src="${IMG + b.src}" alt=""${STATIC ? "" : ' loading="lazy" decoding="async"'} style="aspect-ratio:${b.r}">`;
  const wst = b.w ? `;width:calc(${b.w} * var(--u))${b.k === "right" && !b.inpair ? `;margin-left:calc(${1360 - b.w} * var(--u))` : ""}${b.cen ? `;margin-left:calc(${(1360 - b.w) / 2} * var(--u))` : ""}` : "";
  return `<div class="blk ${b.k} media${b.w ? " wv" : ""}${b.cen ? " cen" : ""}" data-sp="${b.sp || 0}" style="--gap:${b.gap ?? 200}${wst}"><div>${inner}</div></div>`;
}
const FL = [];
for (const b of P.flow) {
  if (b.t === "img" || b.t === "html") FL.push(media(b));
  else if (b.t === "pair") FL.push(`<div class="pair${b.rev ? " rev" : ""}" style="--gap:${b.gap ?? 200};--off:${b.off ?? 280}">${media({ ...b.a, gap: 0, inpair: 1 })}${media({ ...b.b, gap: 0, inpair: 1 })}</div>`);
  else if (b.t === "line") FL.push(`<div class="line">${b.lb ? `<div class="bl rv">${b.lb}</div>` : ""}<p class="rv">${esc(b.p)}</p></div>`);
  else if (b.t === "box") FL.push(`<div class="blk full" style="--gap:${b.gap ?? 200}"><div class="stage" id="stage"></div></div>`);
  else if (b.t === "phone") FL.push(`<div class="blk full" style="--gap:${b.gap ?? 200};padding:calc(40 * var(--u)) 0 0" id="phoneblk"></div>`);
}
H.push(`<section class="flow">${FL.join("")}</section>`);
H.push(`<section class="end"><div class="lb rv">More projects</div><a class="nx ttl rv" href="#">${esc(P.next).replace(/\n/g, "<br>").replace(/×/g, '<span class="x">×</span>')}</a>
<div class="ct"><span>kimyeri.design@gmail.com</span><span>Kim Yeri — Digital &amp; Brand Designer</span></div></section>`);
app.innerHTML = H.join("");

/* 3D package box */
function buildBox() {
  const st = document.getElementById("stage"); if (!st) return;
  const W = st.clientWidth, s = M() ? 0.4 : W / 1360;
  const w = 780 * s, h = w * 452 / 858, d = 156 * s;
  const front = `background:url(${IMG}cheremi/pk-front.png) center/100% 100%`;
  const faces = { front, back: front, top: "background:linear-gradient(180deg,#f7f8f9,#eceef0)", bottom: "background:#cfd1d4", right: "background:linear-gradient(90deg,#d9dbde,#cbcdd0)", left: "background:linear-gradient(90deg,#e4e6e9,#d8dadd)" };
  const f = (n, FW, FH, tr) => `<div style="width:${FW}px;height:${FH}px;margin:${-FH / 2}px 0 0 ${-FW / 2}px;transform:${tr};${faces[n]}"></div>`;
  st.innerHTML = `<div class="box" id="box">${f("front", w, h, `translateZ(${d / 2}px)`)}${f("back", w, h, `rotateY(180deg) translateZ(${d / 2}px)`)}${f("right", d, h, `rotateY(90deg) translateZ(${w / 2}px)`)}${f("left", d, h, `rotateY(-90deg) translateZ(${w / 2}px)`)}${f("top", w, d, `rotateX(90deg) translateZ(${h / 2}px)`)}${f("bottom", w, d, `rotateX(-90deg) translateZ(${h / 2}px)`)}</div>`;
}
buildBox();
function buildPhone() {
  const pb = document.getElementById("phoneblk"); if (!pb) return;
  const b = P.flow.find((x) => x.t === "phone");
  const pw = M() ? 230 : 400 * (pb.clientWidth / 1360), ph = pw * 1200 / 615;
  pb.innerHTML = `<div class="phone" style="width:${pw}px;height:${ph}px"><div class="scr" style="left:3.209%;top:1.293%;width:93.582%;height:96.445%;border-radius:${pw * .93582 * .135}px"><img src="${IMG}social/${b.src}.webp" alt=""></div><img class="frm" src="${IMG}social/phone-frame.png" alt=""></div><div class="brands">${b.brands.map((n, i) => `<span class="${i === b.on ? "on" : ""}">${n}</span>`).join("")}</div>`;
}
buildPhone();
document.querySelectorAll(".car").forEach((c) => {
  const trk = c.querySelector(".trk"), n = trk.children.length, pv = c.querySelector(".prev"), nx = c.querySelector(".next"); let i = 0;
  const go = (k) => { i = Math.max(0, Math.min(n - 1, k)); trk.style.transform = `translateX(${-i * 100}%)`; pv.hidden = i === 0; nx.hidden = i === n - 1; };
  pv.onclick = () => go(i - 1); nx.onclick = () => go(i + 1); go(0);
});
const box = () => document.getElementById("box");
function setBox(p) { const b = box(); if (b) b.style.transform = `rotateX(${-16 + p * 6}deg) rotateY(${-34 + p * 40}deg)`; }
setBox(0);

/* parallax + reveal */
const meds = [...document.querySelectorAll(".media")];
function tick() {
  if (!MOTION) return;
  const vh = innerHeight;
  for (const m of meds) {
    const sp = +m.dataset.sp; if (!sp) continue;
    const r = m.getBoundingClientRect();
    const c = (r.top + r.height / 2 - vh / 2);
    m.firstElementChild.style.transform = `translateY(${-c * sp}px)`;
  }
  const st = document.getElementById("stage");
  if (st) { const r = st.getBoundingClientRect(); const p = Math.min(1, Math.max(0, 1 - (r.top + r.height) / (vh + r.height))); setBox(p); }
  requestAnimationFrame(tick);
}
if (MOTION) {
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll(".rv").forEach((x) => io.observe(x));
  requestAnimationFrame(tick);
}
const cueEl = document.querySelector(".cue");
addEventListener("scroll", () => { if (cueEl && scrollY > 8) cueEl.classList.add("gone"); }, { passive: true });
addEventListener("resize", () => { buildBox(); setBox(0); buildPhone(); });
if (window.afterBuild) window.afterBuild();

/* brand tabs + flat detail view */
const BR = {
  Abbvie: { scr: { v: "abbvie-reel-3" }, set: ["abbvie-c1-1", "abbvie-c1-2", "abbvie-c2-1", "abbvie-c2-2", "abbvie-c3-1", "abbvie-c3-2"] },
  "Samsung Members": null,
  Crocs: { scr: { i: "crocs-1" }, set: ["crocs-3", "crocs-5", "crocs-6", "crocs-2", "crocs-8"] },
  Theraflu: { scr: { v: "theraflu-reel" }, set: ["theraflu-c-1", "theraflu-c-2", "theraflu-c-3", "theraflu-c-4", "theraflu-c-5"] },
};
const TXT = {}; (P.flow || []).forEach((b) => { if (b.t === "line" && b.lb) TXT[b.lb] = b.p; });
let curBrand = null;
function setScreen(name) {
  const scr = document.querySelector(".phone .scr"); const d = BR[name]; if (!scr || !d) return;
  curBrand = name;
  scr.innerHTML = d.scr.v ? `<video src="${IMG}social/${d.scr.v}.mp4" poster="${IMG}social/${d.scr.v}-poster.webp" muted loop playsinline ${MOTION ? "autoplay" : ""}></video>` : `<img src="${IMG}social/${d.scr.i}.webp" alt="">`;
  document.querySelectorAll(".brands span").forEach((x) => x.classList.toggle("on", x.textContent === name));
}
document.querySelectorAll(".brands span").forEach((x) => { if (!BR[x.textContent]) x.classList.add("na"); x.onclick = () => setScreen(x.textContent); });
if (document.querySelector(".brands span.on")) curBrand = document.querySelector(".brands span.on").textContent;
const dv = document.getElementById("dv"); let dvSet = [], dvI = 0;
function dvShow(k) {
  dvI = Math.max(0, Math.min(dvSet.length - 1, k));
  let im = document.getElementById("dvimg");
  if (!im) { im = document.createElement("img"); im.id = "dvimg"; im.alt = ""; document.getElementById("dvfig").appendChild(im); }
  im.src = `${IMG}social/${dvSet[dvI]}.webp`;
  document.getElementById("dvp").hidden = dvI === 0; document.getElementById("dvn").hidden = dvI === dvSet.length - 1;
  document.querySelectorAll("#dvth img").forEach((t, j) => t.classList.toggle("on", j === dvI));
}
function dvLayout() {
  const f = dv.querySelector(".fig").getBoundingClientRect(), p = document.getElementById("dvp"), n = document.getElementById("dvn"), th = document.getElementById("dvth");
  if (M()) { p.style.left = "24px"; n.style.left = (16 + 358 - 8 - 36) + "px"; p.style.top = n.style.top = (f.top + f.height / 2) + "px"; th.style.top = (f.bottom + 12) + "px"; return; }
  const a = p.offsetWidth, gap = 24;
  p.style.left = (f.left - gap - a) + "px"; n.style.left = (f.right + gap) + "px"; p.style.top = n.style.top = "50%";
  th.style.left = (f.left - gap - a - 24 - 44) + "px";
}
let dvFrom = null;
const BASE = () => (M() ? "translateX(-50%)" : "translate(-50%,-50%)");
function flip(from, reverse, done) {
  const fig = document.getElementById("dvfig");
  if (!from || !MOTION || !fig.getAnimations) { done && done(); return; }
  const s = from.getBoundingClientRect(), f = fig.getBoundingClientRect();
  if (!s.width || !f.width) { done && done(); return; }
  const dx = s.left + s.width / 2 - (f.left + f.width / 2), dy = s.top + s.height / 2 - (f.top + f.height / 2), k = s.width / f.width;
  const a = { transform: `translate(${dx}px,${dy}px) ${BASE()} scale(${k})` }, b = { transform: BASE() };
  const opt = { duration: 350, easing: "cubic-bezier(.3,.7,.2,1)" };
  fig.animate(reverse ? [b, a] : [a, b], opt);
  const bg = dv.animate(reverse ? [{ backgroundColor: "rgba(236,236,236,1)" }, { backgroundColor: "rgba(236,236,236,0)" }] : [{ backgroundColor: "rgba(236,236,236,0)" }, { backgroundColor: "rgba(236,236,236,1)" }], opt);
  dv.querySelectorAll(".top,.tx,.th,.arr").forEach((x) => x.animate(reverse ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 1 }], opt));
  bg.onfinish = () => done && done();
}
function openDetail(brand, k, from) {
  const d = BR[brand]; if (!d) return;
  dvSet = d.set; document.getElementById("dvb").textContent = brand; document.getElementById("dvt").textContent = TXT[brand] || "";
  document.getElementById("dvth").innerHTML = dvSet.map((n, j) => `<img src="${IMG}social/${n}.webp" data-j="${j}" alt="">`).join("");
  document.querySelectorAll("#dvth img").forEach((t) => (t.onclick = () => dvShow(+t.dataset.j)));
  dv.classList.add("open"); document.body.style.overflow = "hidden"; dvShow(k || 0);
  dvFrom = from || null;
  const img = document.getElementById("dvimg");
  const go = () => { dvLayout(); flip(dvFrom, false); };
  img.complete && img.naturalWidth ? go() : img.addEventListener("load", go, { once: true });
}
let closing = false;
function closeDetail() {
  if (!dv.classList.contains("open") || closing) return; closing = true;
  flip(dvFrom, true, () => { dv.classList.remove("open"); document.body.style.overflow = ""; closing = false; });
}
document.getElementById("dvx").onclick = closeDetail;
document.getElementById("dvp").onclick = () => dvShow(dvI - 1);
document.getElementById("dvn").onclick = () => dvShow(dvI + 1);
addEventListener("keydown", (e) => { if (!dv.classList.contains("open")) return; if (e.key === "Escape") closeDetail(); if (e.key === "ArrowLeft") dvShow(dvI - 1); if (e.key === "ArrowRight") dvShow(dvI + 1); });
document.querySelectorAll(".car").forEach((c) => c.querySelectorAll(".trk img").forEach((im, j) => (im.onclick = () => { const b = c.dataset.brand; const list = c.dataset.list.split(","); openDetail(b, BR[b] ? BR[b].set.indexOf(list[j]) : 0, im); })));
const scrEl = document.querySelector(".phone .scr"); if (scrEl) scrEl.onclick = () => openDetail(curBrand, 0, scrEl);
window.openDetail = openDetail; window.setScreen = setScreen;

document.fonts.ready.then(() => Promise.all([...document.images].filter((i) => i.loading !== "lazy").map((i) => i.decode().catch(() => {})))).then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
